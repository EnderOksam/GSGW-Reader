name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get announcement cache date
        id: announcement-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore today's announcements
        id: announcement-cache
        uses: actions/cache/restore@v4
        with:
          path: website/src/lib/announcements.json
          key: discord-announcements-${{ steps.announcement-date.outputs.date }}-normal-${{ github.run_id }}-normal-${{ github.run_id }}
          restore-keys: |
            discord-announcements-${{ steps.announcement-date.outputs.date }}-

      - name: Fetch Discord announcements
        if: steps.announcement-cache.outputs.cache-matched-key == ''
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/fetch_discord_announcements.py

      - name: Save today's announcements
        if: steps.announcement-cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: website/src/lib/announcements.json
          key: discord-announcements-${{ steps.announcement-date.outputs.date }}

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Install Python dependencies
        run: pip install python-frontmatter imagesize Pillow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install npm dependencies
        working-directory: website
        run: npm ci

      - name: Build chapters
        run: |
          python scripts/build_uder.py
          python scripts/build_web.py
          python scripts/build_debut.py

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=ireum
          workingDirectory: website
