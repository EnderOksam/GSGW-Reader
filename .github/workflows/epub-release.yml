name: EPUB Release

on:
  schedule:
    - cron: "0 0 1 * *"
    - cron: "0 0 15 * *"
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install Pillow python-frontmatter imagesize

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build GSGW EPUBs
        run: python scripts/build_new_epub.py --book gsgw --part part1 && python scripts/build_new_epub.py --book gsgw --part part2 && python scripts/build_new_epub.py --book gsgw --part part3

      - name: Build Debut EPUBs
        run: python scripts/build_new_epub.py --book debut --part part1 && python scripts/build_new_epub.py --book debut --part part2 && python scripts/build_new_epub.py --book debut --part part3 && python scripts/build_new_epub.py --book debut --part part4

      - name: Rotate releases
        run: |
          LAST_BODY=$(gh release view "latest" --json body -q .body 2>/dev/null || true)
          LAST_DATE=$(gh release view "latest" --json tagName -q .tagName 2>/dev/null | grep -oP '\d{4}-\d{2}-\d{2}' || true)

          gh release delete "last" --yes --cleanup-tag 2>/dev/null || true
          gh release delete "latest" --yes --cleanup-tag 2>/dev/null || true

          if [ -n "$LAST_DATE" ]; then
            gh release create "last-${LAST_DATE}" \
              --title "last - ${LAST_DATE}" \
              --notes "${LAST_BODY:-}" \
              --prerelease
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate date
        id: date
        run: echo "today=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Create release and upload EPUBs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: latest - ${{ steps.date.outputs.today }}
          body: "EPUB build from ${{ steps.date.outputs.today }}"
          files: |
            scripts/epub/*.epub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
