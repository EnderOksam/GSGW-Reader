name: Build Debut

on:
  workflow_dispatch:
  push:
    paths:
      - "chapters/**/*.md"
      - "website/src/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install frontmatter imagesize Pillow

      - name: Build debut
        run: python scripts/build_debut.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/src/routes/
          git diff --cached --quiet || git commit -m "chore: rebuild debut [skip ci]"
          git push
