name: Deploy Discord Announcements

on:
  workflow_dispatch:

jobs:
  deploy-announcements:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Get announcement cache key
        id: announcement-cache-key
        run: echo "key=discord-announcements-$(date -u +%Y-%m-%d)-manual-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Fetch Discord announcements
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: python scripts/fetch_discord_announcements.py

      - name: Save refreshed announcements
        uses: actions/cache/save@v4
        with:
          path: website/src/lib/announcements.json
          key: ${{ steps.announcement-cache-key.outputs.key }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: website/package-lock.json

      - name: Install npm dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=ireum
          workingDirectory: website
